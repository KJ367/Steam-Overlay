<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stream Overlay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .overlay-wrapper {
            position: absolute;
            top: 30px; left: 30px; 
            transform: scale(1);
            transform-origin: top left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .badge {
            display: flex;
            align-items: center;
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(55, 65, 81, 0.6);
            border-radius: 6px;
            color: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .icon-box {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .twitch-bg { background-color: #9146FF; }
        .discord-bg { background-color: #5865F2; }
        .badge-text {
            padding: 8px 16px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .accent-square {
            padding-right: 12px;
            font-size: 10px;
        }
        .twitch-accent { color: #a855f7; }
        .discord-accent { color: #6366f1; }
    </style>
</head>
<body>
    <div class="overlay-wrapper">
        
        <div class="badge">
            <div class="icon-box twitch-bg"><i class="fa-brands fa-twitch"></i></div>
            <div class="badge-text">SMGKJ_367</div>
            <div class="accent-square twitch-accent"><i class="fa-solid fa-square"></i></div>
        </div>

        
        <div class="badge">
            <div class="icon-box discord-bg"><i class="fa-brands fa-discord"></i></div>
            <div class="badge-text">https://discord.gg/MVgc6gXf6r</div>
            <div class="accent-square discord-accent"><i class="fa-solid fa-square"></i></div>
        </div>
    </div>
</body>
</html>
